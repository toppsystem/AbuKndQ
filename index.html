function show(n){n=(n+im.length)%im.length;if(n===k||busy)return;busy=true;var o=im[k],w=im[n];k=n;
(w.decode?w.decode():Promise.resolve()).catch(function(){}).then(function(){

o.classList.remove("on");o.classList.add("out");w.classList.remove("out");w.classList.add("on");
setTimeout(function(){o.classList.remove("out");busy=false},reduce?50:1050);
ths.forEach(function(b,i){b.classList.toggle("on",i===n)});

if(cap){cap.style.opacity=0;setTimeout(function(){cap.textContent=w.getAttribute("data-cap")||"";cap.style.opacity=1},300)}})}
function tick(){clearTimeout(t);if(!vis||reduce){prog(false);return}prog(true);t=setTimeout(function(){show(k+1);tick()},T)}

if(g){var p=g.querySelector(".gal-nav.p"),nx=g.querySelector(".gal-nav.n");p&&p.addEventListener("click",function(){go(k-1)});nx&&nx.addEventListener("click",function(){go(k+1)});ths.forEach(function(b,i){b.addEventListener("click",function(){go(i)})})}
